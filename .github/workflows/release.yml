# 三平台一键出包 + 签名 + 校验 + 发布（对应 AGENTS.md §10 M7 / §11.1 / 任务工单 T703）
#
# 触发：推送 v* 标签，或手动 dispatch。三个原生 runner 并行出包 → 汇总签名/校验 → 挂到 GitHub Release。
# dry-run：手动 dispatch 勾选 guard_only=true 时，跳过出包/发布，仅跑 verify-guard 作业验证
#   「内嵌公钥 ≡ 签名私钥」守卫是否生效（复用 scripts/verify-signing-guard.sh，与真实签名步骤同一代码）。
# 说明（scope「脚手架优先」）：本工作流已在本地按 wails3 v3.0.0-beta.23 命令模型编写并经 actionlint 校验；
#   真实出包/签名/公证需以下仓库 secrets（缺失时签名步骤自动跳过，不阻断出包）：
#     PHPO_SIGNING_KEY   Ed25519 私钥（base64；scripts/sign-release.sh genkey 生成）——供 .sig 自升级验签
#                        配好私钥后必须把 sign-release.sh pubkey 导出的匹配公钥提交到
#                        internal/updater/signing/public.key（go:embed 编进二进制）；
#                        Sign 步骤与 verify-guard 作业均调用 scripts/verify-signing-guard.sh
#                        在签名前反推公钥比对，不匹配（占位未替换）即拒绝发布（硬红线 6）。
#     APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID / build/signing/*.p12  macOS 开发者签名+公证（可选）
#     WIN_CERT / WIN_CERT_PASSWORD                                                   Windows 代码签名（可选）
#
# 说明：Linux 出包与 ci.yml/lint.yml 同一工具链口径——Wails beta.23 的 Linux cgo 走 GTK4 一路
#   （pkg-config: gtk4 webkitgtk-6.0 libsoup-3.0 gio-unix-2.0 + x11），故 linux matrix 与两个
#   纯脚本作业都用 ubuntu-24.04（22.04 无 libwebkitgtk-6.0-dev）；actions 跟到跑 node24 的主版本。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "核对用版本号（不含前缀 v）；留空则取 wails.json 的 productVersion，与内嵌版本不一致会拒绝发布"
        required: false
        default: ""
      guard_only:
        description: "dry-run：仅校验内嵌公钥与签名私钥匹配，不出包/不发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  # dry-run：勾选 guard_only 时仅此作业运行——复用与真实签名步骤同一脚本，验证守卫是否生效，不出包/不发布。
  verify-guard:
    name: Verify signing guard (dry-run)
    if: github.event_name == 'workflow_dispatch' && inputs.guard_only
    runs-on: ubuntu-24.04
    env:
      PHPO_SIGNING_KEY: ${{ secrets.PHPO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check embedded pubkey matches signing key
        if: env.PHPO_SIGNING_KEY != ''
        run: |
          printf '%s' "$PHPO_SIGNING_KEY" | base64 -d > /tmp/phpo-sign.pem
          chmod 600 /tmp/phpo-sign.pem
          bash scripts/verify-signing-guard.sh /tmp/phpo-sign.pem internal/updater/signing/public.key
          rm -f /tmp/phpo-sign.pem

      - name: Secret not configured → guard cannot be exercised
        if: env.PHPO_SIGNING_KEY == ''
        run: |
          echo "::warning::未配置 PHPO_SIGNING_KEY，无法验证公钥匹配（真实发布时守卫步骤同样会被 if 跳过）"

  build:
    name: Build (${{ matrix.target }})
    if: ${{ !inputs.guard_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
          - target: windows
            os: windows-latest
          - target: darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # 与本机 pnpm 12 对齐：frontend/pnpm-workspace.yaml 只有 allowBuilds 而无 packages:，pnpm 9 读它即报「packages field missing or empty」；lockfile 9.0 由 pnpm 12 向后兼容读取
      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux toolchain (GTK4 / webkitgtk)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      # 顺序要求：`go install …/cmd/wails3` 本身要编译 wails 的 Linux cgo 包
      # （internal/operatingsystem 的 webkit_linux.go 同样 pkg-config gtk4 webkitgtk-6.0），
      # 故工具链必须先于 Wails CLI 安装。
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        shell: bash

      - name: Install NSIS (Windows)
        if: matrix.target == 'windows'
        run: choco install nsis -y
        shell: pwsh

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      # 版本号只在这里取一次（本步骤 shell 显式为 bash）：Taskfile 顶部已不再有全局 `sh:` 动态
      # 变量——那种变量会在编译期无条件求值，任何 runner 上跑不起来就让 `wails3 task` 在 deps
      # 之前整体退出（windows 作业即此症状）。task 从进程环境读 VERSION（GetEnviron 把它并入
      # 模板变量），故此处 export 即等于把版本交给 package:windows 的 -DAPP_VERSION。
      - name: Package ${{ matrix.target }}
        run: |
          export VERSION="$(bash scripts/version.sh)"
          if [ -z "$VERSION" ]; then
            echo "::error::scripts/version.sh 未从 wails.json 取到版本号"
            exit 1
          fi
          echo "打包版本：$VERSION"
          wails3 task package:${{ matrix.target }}
        shell: bash

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          path: build/bin/*
          if-no-files-found: error

  release:
    name: Sign & Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      # 提到 job 级 env：步骤 if 可读 env 上下文（secrets 上下文在 step if 不可用）。
      PHPO_SIGNING_KEY: ${{ secrets.PHPO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # merge-multiple: true —— 三个平台的产物一律平铺进 out/，不套 `pkg-<target>/` 子目录。
      # 下游两处都按平铺消费：gen-checksums.sh 用 `find out -maxdepth 1 -type f`，
      # 发布步骤用 `files: out/*`。钉死该输入后 download-artifact 各主版本行为一致。
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          name: pkg-linux
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with: { name: pkg-windows, path: out, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { name: pkg-darwin, path: out, merge-multiple: true }

      # 版本与发布标签在此一处裁决。唯一真实来源是 wails.json 的 productVersion（scripts/version.sh，
      # 也就是 build 任务用 -ldflags 注入二进制的内嵌版本），理由三条：
      #   ① 手动 workflow_dispatch 时 github.ref_name 是**分支名**，拿它当 tag_name 会朝 main 建 Release；
      #   ② 标签若与内嵌版本不一致，等于发一份 version 高于盘上构件的清单——客户端据此升级到一个不存在的版本
      #      （三条互不同源的版本链见 docs/打包发布.md §6.2）；
      #   ③ manifest 的资产直链（ASSET_BASE）必须用最终标签拼，否则指向不存在的 tag。
      # 因此 inputs.version 只是「待核对的声明」，与内嵌版本不等即拒绝发布——不接受它覆盖版本号。
      - name: Resolve version and tag
        id: ver
        run: |
          set -euo pipefail
          expected="$(bash scripts/version.sh)"
          if [ -z "$expected" ]; then
            echo "::error::scripts/version.sh 未从 wails.json 取到 productVersion"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            declared="${GITHUB_REF_NAME#v}"
          else
            declared="${{ inputs.version }}"
            declared="${declared:-$expected}"
            tag="v$declared"
          fi
          if [ "$declared" != "$expected" ]; then
            echo "::error::版本不一致：$declared ≠ wails.json 的 productVersion $expected（二进制内嵌版本）"
            echo "::error::请先用 scripts/bump-version.sh 定版再推标签，或让标签/dispatch 参数等于 $expected"
            exit 1
          fi
          # 标签已存在但指向别的提交时，构件与 Release 会对不上（dispatch 从分支 HEAD 出包）。
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha="$(git rev-list -n1 "$tag")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::标签 $tag 已指向 ${tag_sha:0:7}，本次构件来自 ${GITHUB_SHA:0:7}，资产会挂错提交"
              echo "::error::请定版后推新标签（推荐），或在明确授权下移动已有标签"
              exit 1
            fi
          fi
          echo "version=$expected" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "发布 $tag（版本 $expected）"

      - name: Sign artifacts (Ed25519 → .sig)
        if: env.PHPO_SIGNING_KEY != ''
        run: |
          printf '%s' "$PHPO_SIGNING_KEY" | base64 -d > /tmp/phpo-sign.pem
          chmod 600 /tmp/phpo-sign.pem
          # 硬红线6：二进制内嵌公钥在 build 期固化，必须与签名私钥匹配，否则客户端验签全失败。
          # 与 dry-run verify-guard 作业复用同一脚本，不匹配（占位未替换）即拒绝发布。
          bash scripts/verify-signing-guard.sh /tmp/phpo-sign.pem internal/updater/signing/public.key
          PHPO_SIGNING_KEY=/tmp/phpo-sign.pem bash scripts/sign-release.sh sign out/*
          rm -f /tmp/phpo-sign.pem

      - name: Generate checksums.txt
        run: BIN_DIR=out bash scripts/gen-checksums.sh

      # 发布清单 manifest.json：应用内「检查更新」并发拉取 config.yaml 的 update_sources 里每一个源上的这份 JSON（§5.9）。
      # 只在真签名时生成——无 .sig 的包客户端必然验签失败（硬红线 6），宁可不发布这版更新也不发一份装不上的清单。
      # ASSET_BASE / DOWNLOAD_PAGE 一律用上面解析出的标签拼（不再让脚本回落到 GITHUB_REF_NAME：
      # 手动 dispatch 时那是分支名，直链会指向不存在的 tag）。
      - name: Generate release manifest
        if: env.PHPO_SIGNING_KEY != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}
          DOWNLOAD_PAGE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}
        run: bash scripts/gen-release-manifest.sh

      # tag_name 用解析出的标签（push 事件即 github.ref_name；dispatch 事件是 v<版本>，因为那时
      # github.ref_name 只是分支名）。标签不存在时该动作会在本次构件所在的提交上创建它。
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: phpo ${{ steps.ver.outputs.version }}
          body_path: ${{ github.workspace }}/docs/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          files: |
            out/*
