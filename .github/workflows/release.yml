# 三平台一键出包 + 签名 + 校验 + 发布（对应 AGENTS.md §10 M7 / §11.1 / 任务工单 T703）
#
# 触发：推送 v* 标签，或手动 dispatch。三个原生 runner 并行出包 → 汇总签名/校验 → 挂到 GitHub Release。
# dry-run：手动 dispatch 勾选 guard_only=true 时，跳过出包/发布，仅跑 verify-guard 作业验证
#   「内嵌公钥 ≡ 签名私钥」守卫是否生效（复用 scripts/verify-signing-guard.sh，与真实签名步骤同一代码）。
# 说明（scope「脚手架优先」）：本工作流已在本地按 wails3 v3.0.0-beta.23 命令模型编写并经 actionlint 校验；
#   真实出包/签名/公证需以下仓库 secrets（缺失时签名步骤自动跳过，不阻断出包）：
#     PHPO_SIGNING_KEY   Ed25519 私钥（base64；scripts/sign-release.sh genkey 生成）——供 .sig 自升级验签
#                        配好私钥后必须把 sign-release.sh pubkey 导出的匹配公钥提交到
#                        internal/updater/signing/public.key（go:embed 编进二进制）；
#                        Sign 步骤与 verify-guard 作业均调用 scripts/verify-signing-guard.sh
#                        在签名前反推公钥比对，不匹配（占位未替换）即拒绝发布（硬红线 6）。
#     APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID / build/signing/*.p12  macOS 开发者签名+公证（可选）
#     WIN_CERT / WIN_CERT_PASSWORD                                                   Windows 代码签名（可选）
#
# 说明：Linux 出包与 ci.yml/lint.yml 同一工具链口径——Wails beta.23 的 Linux cgo 走 GTK4 一路
#   （pkg-config: gtk4 webkitgtk-6.0 libsoup-3.0 gio-unix-2.0 + x11），故 linux matrix 与两个
#   纯脚本作业都用 ubuntu-24.04（22.04 无 libwebkitgtk-6.0-dev）；actions 跟到跑 node24 的主版本。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不含前缀 v），如 0.1.0"
        required: false
        default: ""
      guard_only:
        description: "dry-run：仅校验内嵌公钥与签名私钥匹配，不出包/不发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  # dry-run：勾选 guard_only 时仅此作业运行——复用与真实签名步骤同一脚本，验证守卫是否生效，不出包/不发布。
  verify-guard:
    name: Verify signing guard (dry-run)
    if: github.event_name == 'workflow_dispatch' && inputs.guard_only
    runs-on: ubuntu-24.04
    env:
      PHPO_SIGNING_KEY: ${{ secrets.PHPO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check embedded pubkey matches signing key
        if: env.PHPO_SIGNING_KEY != ''
        run: |
          printf '%s' "$PHPO_SIGNING_KEY" | base64 -d > /tmp/phpo-sign.pem
          chmod 600 /tmp/phpo-sign.pem
          bash scripts/verify-signing-guard.sh /tmp/phpo-sign.pem internal/updater/signing/public.key
          rm -f /tmp/phpo-sign.pem

      - name: Secret not configured → guard cannot be exercised
        if: env.PHPO_SIGNING_KEY == ''
        run: |
          echo "::warning::未配置 PHPO_SIGNING_KEY，无法验证公钥匹配（真实发布时守卫步骤同样会被 if 跳过）"

  build:
    name: Build (${{ matrix.target }})
    if: ${{ !inputs.guard_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
          - target: windows
            os: windows-latest
          - target: darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # 与本机 pnpm 12 对齐：frontend/pnpm-workspace.yaml 只有 allowBuilds 而无 packages:，pnpm 9 读它即报「packages field missing or empty」；lockfile 9.0 由 pnpm 12 向后兼容读取
      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux toolchain (GTK4 / webkitgtk)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      # 顺序要求：`go install …/cmd/wails3` 本身要编译 wails 的 Linux cgo 包
      # （internal/operatingsystem 的 webkit_linux.go 同样 pkg-config gtk4 webkitgtk-6.0），
      # 故工具链必须先于 Wails CLI 安装。
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        shell: bash

      - name: Install NSIS (Windows)
        if: matrix.target == 'windows'
        run: choco install nsis -y
        shell: pwsh

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Package ${{ matrix.target }}
        run: wails3 task package:${{ matrix.target }}
        shell: bash

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}
          path: build/bin/*
          if-no-files-found: error

  release:
    name: Sign & Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      # 提到 job 级 env：步骤 if 可读 env 上下文（secrets 上下文在 step if 不可用）。
      PHPO_SIGNING_KEY: ${{ secrets.PHPO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # merge-multiple: true —— 三个平台的产物一律平铺进 out/，不套 `pkg-<target>/` 子目录。
      # 下游两处都按平铺消费：gen-checksums.sh 用 `find out -maxdepth 1 -type f`，
      # 发布步骤用 `files: out/*`。钉死该输入后 download-artifact 各主版本行为一致。
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          name: pkg-linux
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with: { name: pkg-windows, path: out, merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { name: pkg-darwin, path: out, merge-multiple: true }

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "version=${{ inputs.version }}" >>"$GITHUB_OUTPUT";
          else echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"; fi

      - name: Sign artifacts (Ed25519 → .sig)
        if: env.PHPO_SIGNING_KEY != ''
        run: |
          printf '%s' "$PHPO_SIGNING_KEY" | base64 -d > /tmp/phpo-sign.pem
          chmod 600 /tmp/phpo-sign.pem
          # 硬红线6：二进制内嵌公钥在 build 期固化，必须与签名私钥匹配，否则客户端验签全失败。
          # 与 dry-run verify-guard 作业复用同一脚本，不匹配（占位未替换）即拒绝发布。
          bash scripts/verify-signing-guard.sh /tmp/phpo-sign.pem internal/updater/signing/public.key
          PHPO_SIGNING_KEY=/tmp/phpo-sign.pem bash scripts/sign-release.sh sign out/*
          rm -f /tmp/phpo-sign.pem

      - name: Generate checksums.txt
        run: BIN_DIR=out bash scripts/gen-checksums.sh

      # 发布清单 manifest.json：应用内「检查更新」并发拉取 config.yaml 的 update_sources 里每一个源上的这份 JSON（§5.9）。
      # 只在真签名时生成——无 .sig 的包客户端必然验签失败（硬红线 6），宁可不发布这版更新也不发一份装不上的清单。
      # download_page 给发布页地址（客户端「打开下载页」按钮的目标）；tag 由版本号推出，
      # 因手动 dispatch 时 github.ref_name 是分支名而非标签。
      - name: Generate release manifest
        if: env.PHPO_SIGNING_KEY != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DOWNLOAD_PAGE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}
        run: bash scripts/gen-release-manifest.sh

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: phpo ${{ steps.ver.outputs.version }}
          body_path: ${{ github.workspace }}/docs/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/*
