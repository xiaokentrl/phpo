# Lint 门禁：Go 格式/静态 + 前端类型 + 工作流自检（对应 AGENTS.md §11.3 / 并行轨 TX01）
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  go-lint:
    name: Go fmt & golangci-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install webkit2gtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "需要 gofmt 的文件:"; echo "$out"; exit 1; fi

      # go vet 为阻断门禁：属 Go 工具链、离线可验真，本地已全绿。
      # 即便下方 golangci-lint 暂非阻断，vet 级问题也会在此拦下。
      - name: go vet
        run: go vet ./...

      # golangci-lint 目前设为非阻断：编写环境离线无法本地安装/验证其是否全绿
      # （errcheck/staticcheck/gosimple/unused/ineffassign/goimports/misspell 均需联网装二进制）；
      # 先输出暴露问题，待首次联网 CI 确认干净后改回阻断（删去 continue-on-error）。
      - name: golangci-lint
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.61.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # vue-tsc 静态导入 frontend/bindings/（wails3 生成物且被 gitignore），全新 checkout 必须先出绑定，
  # 否则 typecheck 作业与 CI 的前端作业一样恒红。工具链同 ci.yml frontend 作业。
  frontend-lint:
    name: Frontend typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install webkit2gtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate TS bindings
        run: wails3 generate bindings -ts -clean

      - name: Install deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: vue-tsc typecheck
        run: pnpm -C frontend exec vue-tsc --noEmit

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
