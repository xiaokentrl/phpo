# Lint 门禁：Go 格式/静态 + 前端类型 + 工作流自检（对应 AGENTS.md §11.3 / 并行轨 TX01）
#
# 说明：runner 与工具链口径同 ci.yml——Wails beta.23 的 Linux cgo 走 GTK4 一路
#   （pkg-config: gtk4 webkitgtk-6.0 libsoup-3.0 gio-unix-2.0 + x11），故须 ubuntu-24.04；
#   actions 一律跟到跑 node24 的主版本，否则本文件的 actionlint 作业把三个工作流一起判红。
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  go-lint:
    name: Go fmt & golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GTK4 / webkitgtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "需要 gofmt 的文件:"; echo "$out"; exit 1; fi

      # go vet 为阻断门禁：属 Go 工具链、离线可验真，本地已全绿。
      # 即便下方 golangci-lint 暂非阻断，vet 级问题也会在此拦下。
      - name: go vet
        run: go vet ./...

      # v2 主线（v2.13.2，built with go1.27）——原钉的 v1.61.0 用 go1.23 构建，面对 `go 1.27` 目标
      # 直接 `can't load config …` 退出码 3，即该步一项检查都没跑（不是「跑过且干净」）。
      # 仍设为非阻断：迁移后本机首次真跑暴露 **31** 项既有问题（errcheck 18／staticcheck 6／
      # unused 4／goimports 3），逐项处置属独立工单，待其清零后再删去 continue-on-error 转为门禁。
      - name: golangci-lint
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # vue-tsc 静态导入 frontend/bindings/（wails3 生成物且被 gitignore），全新 checkout 必须先出绑定，
  # 否则 typecheck 作业与 CI 的前端作业一样恒红。工具链同 ci.yml frontend 作业。
  frontend-lint:
    name: Frontend typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # 与本机 pnpm 12 对齐：frontend/pnpm-workspace.yaml 只有 allowBuilds 而无 packages:，pnpm 9 读它即报「packages field missing or empty」；lockfile 9.0 由 pnpm 12 向后兼容读取
      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install GTK4 / webkitgtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate TS bindings
        run: wails3 generate bindings -ts -clean

      - name: Install deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: vue-tsc typecheck
        run: pnpm -C frontend exec vue-tsc --noEmit

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: reviewdog/action-actionlint@v1
