# CI 主链路：构建 + 全量单测 + 工程规范校验 + 前端构建（对应 AGENTS.md §11.3 / 并行轨 TX01）
#
# 说明：`go build ./...` 与 `go test ./...` 会编译含 Wails ui 包在内的全部包，Linux 上需 GTK4/webkitgtk 开发头（CGO）。
#   Wails v3.0.0-beta.23 未加 `gtk3` 构建标签时走的是 GTK4 一路（#cgo pkg-config: gtk4 webkitgtk-6.0
#   libsoup-3.0 gio-unix-2.0 glib-2.0 gobject-2.0 + x11），故 runner 必须是 ubuntu-24.04：
#   22.04 的 apt 源里根本没有 libwebkitgtk-6.0-dev，装旧的 libwebkit2gtk-4.1-dev 编不过（build/vet 恒红）。
#   纯逻辑单测不触碰真实 Docker；集成 live 测以 PHPO_LIVE 门禁，默认 skip，不在 CI 强跑。
#
# 说明：actions 一律跟到跑 node24 的主版本（checkout v5 / setup-go v6 / setup-node v6 /
#   pnpm-action-setup v5 / upload-artifact v7 / download-artifact v8）——node20 运行时已被
#   actionlint 判为弃用（error），三个工作流只要还钉在旧主版本，Lint 的 workflow-lint 作业即恒红。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GTK4 / webkitgtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Project checks (i18n / templates / docker-naming / cache-manifest / ext-catalog)
        run: |
          go run ./scripts/check-i18n-keys.go
          go run ./scripts/check-templates.go
          go run ./scripts/check-docker-naming.go
          go run ./scripts/check-cache-manifest.go
          go run ./scripts/check-ext-catalog.go

  # 说明：本作业与 go 作业共用同一构建口径（wails3 task），且必须先有 TS 绑定。
  # frontend/bindings/ 是 wails3 生成物且被 gitignore（§4.1），全新 checkout 里并不存在，
  # 而 vue-tsc --noEmit 静态导入它——直接 pnpm build 会因 20 处 TS2307 恒红。
  # bindings 的生成已收进 Taskfile 的 frontend:build 依赖，这里不再单列，避免两处口径漂移。
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # 与本机 pnpm 12 对齐：frontend/pnpm-workspace.yaml 只有 allowBuilds 而无 packages:，pnpm 9 读它即报「packages field missing or empty」；lockfile 9.0 由 pnpm 12 向后兼容读取
      - uses: pnpm/action-setup@v5
        with:
          version: 12

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install GTK4 / webkitgtk toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev build-essential pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build
        run: wails3 task frontend:build
