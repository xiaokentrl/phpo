# phpo 统一配置示例（YAML）。真实配置文件由运行时写入 XDG 用户配置目录：
#   Linux   ~/.config/phpo/config.yaml
#   macOS   ~/Library/Application Support/phpo/config.yaml
#   Windows %APPDATA%\phpo\config.yaml
# 此处仅作格式参考与开发者本地覆盖；phpo 不读取仓库内本文件。

# 目录根：数据根与站点根；`~` 在展示层解析。派生子目录（php/nginx/…）由程序现算，不写进本文件。
phpo_home: ~/phpo   # PHPO_HOME：服务配置/日志的数据根，默认 ~/phpo
www_root: ~/www     # WWW_ROOT：站点根目录，默认 ~/www

# 可自定义根（总纲 §5.15）：置空或不写即回落默认；同一类路径永远只有一个生效值（自定义与默认互斥）
offline_root: ""    # 离线缓存根，默认 {phpo_home}/offline
backup_root: ""     # 备份归档根，默认 {phpo_home}/backups

# 升级发布源（总纲 §5.9）：全部源**并发**探测（各自独立 15s 超时，超时即判该源不可用），取版本序最新的一份；
# 全部不可用才报错并逐项点名。数组顺序决定「版本并列时取哪一份」与报错点名的顺序。
# 只匿名读取发布清单，不存放任何凭据（§1.5）。清空或不写即回落内置的默认源（github 一条）。
# 清单需含 version 与按平台分列的 assets（os/format/url/size/sha256/signature）。
update_sources:
  - name: github
    manifest_url: https://github.com/xiaokentrl/phpo/releases/latest/download/manifest.json
  # 追加一条即多探测一个源（镜像源常滞后，故并发取版本最大而不是先命中先返）；name 仅用于日志与界面显示「更新源」
  # - name: gitee
  #   manifest_url: https://gitee.com/your-name/phpo/releases/latest/download/manifest.json

# Docker 镜像源（总纲 §5.14.3 里「联网拉取」那一级）：一行一个主机名（可带端口），只填地址、不填路径；空列表或不写 = 不改写镜像名，直连官方源。
# 拉取时这些源**并发测速、谁快先用谁**（不是按本列表的顺序试），最快那个连不上就依次试下一个；全部失败才回落原始镜像名。
# 数组顺序只决定设置页与日志里点名的先后，不决定优先级。
# 这里配的是「phpo 自己去哪儿拉」，不改 Docker 守护进程的 registry-mirrors，因此不影响你在 Docker Desktop / 命令行里拉的其他镜像。
docker_sources:
  - docker.m.daocloud.io
  - dockerproxy.net
  # - 123456.mirror.aliyuncs.com   # 阿里云个人加速器地址同样可用

# 每服务版本的可配置项（按需出现；未列出的版本回落注册表默认端口与默认密码）
# 密码策略：明文、默认 123456、可为空、长度不校验（总纲 §1.5）。
# data_dir 同样互斥：写了即用该目录，未写回落默认 {phpo_home}/{kind}/{version}/data。
services:
  mysql:
    "8.4":
      password: "123456"
      port: 3306
      data_dir: /srv/mysql-data   # 可选：自定义该版本的数据存放路径
  pgsql:
    "17":
      password: ""        # 空密码合法
      port: 5432
  redis:
    "8":
      password: "123456"
