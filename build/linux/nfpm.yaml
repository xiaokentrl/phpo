# nfpm 打包配置（Linux deb/rpm），供 `wails3 tool package -format deb|rpm -config build/linux/nfpm.yaml` 使用
# 依据 AGENTS.md §11.1：phpo_x.x.x_amd64.deb / .rpm 交付物
name: phpo
arch: amd64
platform: linux
version: 0.1.149
section: default
priority: optional
maintainer: phpo <kentrl@qq.com>
description: |
  phpo - 面向 PHP 开发者的本地 Docker 化开发环境管理器（Windows / macOS / Linux 桌面应用）。
homepage: https://github.com/xiaokentrl/phpo
license: MIT
vendor: phpo
# 依赖按 ldd build/bin/phpo 的实际链接写（GTK4 / WebKitGTK-6.0 / libsoup-3 栈）。
# 旧写法 libwebkit2gtk-4.1-0 是 GTK3 时代的包，装上它程序照样缺 libwebkitgtk-6.0.so.4 起不来。
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libjavascriptcoregtk-6.0-1
  - libsoup-3.0-0
scripts:
  postinstall: build/linux/postinstall.sh
contents:
  - src: build/bin/phpo
    dst: /usr/bin/phpo
    file_info:
      mode: 0755
  - src: build/linux/io.github.xiaokentrl.phpo.desktop
    dst: /usr/share/applications/io.github.xiaokentrl.phpo.desktop
    file_info:
      mode: 0644
  - src: build/linux/icons/128x128/phpo.png
    dst: /usr/share/icons/hicolor/128x128/apps/phpo.png
    file_info:
      mode: 0644
  - src: build/linux/icons/256x256/phpo.png
    dst: /usr/share/icons/hicolor/256x256/apps/phpo.png
    file_info:
      mode: 0644
  - src: build/linux/icons/512x512/phpo.png
    dst: /usr/share/icons/hicolor/512x512/apps/phpo.png
    file_info:
      mode: 0644
# rpm 与 deb 的 webkit 依赖包名不同，用 nfpm overrides 分别覆盖
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0  # Fedora 系包名；libsoup3 / javascriptcoregtk6.0 由它连带拉齐
